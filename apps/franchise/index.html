<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Soul540 — Franquia</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #0a0f1e; }
      #boot-status {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        color: #f1f5f9;
        font: 500 16px/1.5 Outfit, Arial, sans-serif;
        text-align: center;
      }
      #boot-status button {
        display: block;
        margin: 16px auto 0;
        padding: 10px 16px;
        border: 0;
        border-radius: 8px;
        background: #f59e0b;
        color: #111827;
        cursor: pointer;
        font: inherit;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-status" role="status" aria-live="polite">Carregando Soul540...</div>
    </div>
    <script>
      (() => {
        const root = document.getElementById('root');
        const showBootError = () => {
          if (!root?.querySelector('#boot-status')) return;
          root.innerHTML = '<div id="boot-status" role="alert">Não foi possível iniciar o sistema.<button type="button" onclick="location.reload()">Recarregar página</button></div>';
        };
        window.addEventListener('unhandledrejection', showBootError);
        window.addEventListener('error', (event) => {
          if (event.error || event.target instanceof HTMLScriptElement) showBootError();
        }, true);
        window.setTimeout(() => {
          if (root?.querySelector('#boot-status')) showBootError();
        }, 10000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
