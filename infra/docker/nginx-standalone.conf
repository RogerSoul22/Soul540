# Portal isolado (Coolify): o roteamento por caminho fica no Traefik.
# Sem strip de prefixo: o caminho completo chega aqui.
server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location = /fabrica {
        try_files /index.html =404;
    }

    location ^~ /fabrica/ {
        rewrite ^/fabrica/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    location = /franchise-assets {
        try_files /index.html =404;
    }

    location ^~ /franchise-assets/ {
        rewrite ^/franchise-assets/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
